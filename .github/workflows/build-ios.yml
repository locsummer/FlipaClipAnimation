name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build iOS App (.app)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R iosApp/build/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r FlipaClipAnimation.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipaClipAnimation-IPA
          path: FlipaClipAnimation.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release with Direct IPA Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build
          name: "FlipaClip iOS Build (Sideloadly IPA)"
          body: "Direct download of FlipaClipAnimation.ipa for Sideloadly installation."
          files: FlipaClipAnimation.ipa
